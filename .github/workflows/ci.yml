name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --affected needs real git history to diff against; a shallow
          # clone makes turbo assume everything changed.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Resolve turbo affected base
        id: turbo-base
        run: .github/workflows/resolve-turbo-base.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}

      #A stale openapi.d.ts is worse than a missing one
      - run: pnpm gen:openapi
      - run: git diff --exit-code -- server/openapi.json client/src/api/openapi.d.ts
      - run: pnpm typecheck:affected
        env:
          TURBO_SCM_BASE: ${{ steps.turbo-base.outputs.base }}
      - run: pnpm lint:affected
        env:
          TURBO_SCM_BASE: ${{ steps.turbo-base.outputs.base }}
      - run: pnpm test:affected
        env:
          TURBO_SCM_BASE: ${{ steps.turbo-base.outputs.base }}
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:server
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
