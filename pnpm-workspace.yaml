packages:
  - apps/*
  - services/*

# Single-version policy: any external dependency shared by two or more
# workspace packages must be declared here and referenced as `catalog:` in
# each package.json, instead of being copy-pasted as a version literal.
# `scripts/check-dependency-policy.mjs` (`pnpm deps:check`) enforces this.
catalog:
  zod: ^4.4.3
  hono: ^4.12.31
  drizzle-orm: ^0.45.2
  "@ai-sdk/openai": 4.0.19
  ai: 7.0.36
  "@types/node": 22.20.1
  turbo: ^2.10.6
  zustand: ^5.0.14

# strict: `pnpm add` rejects a version outside the catalog for any
# dependency already governed by it, instead of silently drifting.
catalogMode: strict

allowBuilds:
  "@swc/core": true
  autoevals: true
  better-sqlite3: true
  braintrust: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  workerd: true
