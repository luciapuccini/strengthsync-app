# Local workflow runtime (docs/operations/local_worker.md):
#   workflow-api     — private workflow start/status API (compose network only)
#   temporal-worker  — polls Temporal Cloud and runs activities (outbound only)
#   cloudflared      — the single inbound path from the Cloudflare Worker
#
# Secrets come from .env.workflows (git-ignored; see .env.workflows.example).
# Services use restart: "no" — startup and recovery are deliberate manual actions:
#   docker compose -f docker-compose.workflows.yml up -d --build

services:
  workflow-api:
    build:
      context: .
      dockerfile: apps/workflows/Dockerfile
    image: strengthsync-workflows:latest
    command: ["node_modules/.bin/tsx", "src/api/server.ts"]
    env_file:
      - path: .env.workflows
        required: false
    restart: "no"
    networks: [workflows]
    # No ports published: reachable only from cloudflared via the compose network.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal-worker:
    build:
      context: .
      dockerfile: apps/workflows/Dockerfile
    image: strengthsync-workflows:latest
    command: ["node_modules/.bin/tsx", "src/worker.ts"]
    env_file:
      - path: .env.workflows
        required: false
    restart: "no"
    networks: [workflows]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: "no"
    networks: [workflows]
    depends_on:
      workflow-api:
        condition: service_healthy

networks:
  workflows:
